name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token is ever
# created, stored, or pasted anywhere. Manual only, by design: a v* tag is a
# release of the *repository* (installable from the tag), and putting a
# version on PyPI is a separate, deliberate act from the Actions tab.
# PyPI cannot un-publish a version number, so nothing here runs on push.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[vulture]'
      - run: python -m pytest -q
      - run: python -m pytest examples/webapp -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC token PyPI verifies; this is what replaces a secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
