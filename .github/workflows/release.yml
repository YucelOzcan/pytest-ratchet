name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token is ever
# created, stored, or pasted anywhere. Trigger it by hand from the Actions
# tab, or by pushing a v* tag.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[vulture]'
      - run: python -m pytest -q
      - run: python -m pytest examples/webapp -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC token PyPI verifies; this is what replaces a secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
